[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-contrib-demographics-plugin"
description = "Tutor plugin for the Open edX Registration Demographics Plugin"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["../LICENSE"]
authors = [
    { name = "OEX 2026 Workshop Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = ["tutor", "openedx", "plugin", "demographics", "workshop"]
dependencies = ["tutor>=20", "tutor-mfe>20"]
dynamic = ["readme", "version"]

[project.entry-points."tutor.plugin.v1"]
demographics_plugin = "tutordemographicsplugin.plugin"

[project.urls]
Homepage = "https://github.com/openedx/oex26-demographics-plugin"
Repository = "https://github.com/openedx/oex26-demographics-plugin"

[tool.setuptools.dynamic]
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.setuptools.packages.find]
where = ["."]
include = ["tutordemographicsplugin*"]

[tool.setuptools_scm]
# The root for the git repo is one directory up.
root = ".."
version_scheme = "only-version"
local_scheme = "no-local-version"
